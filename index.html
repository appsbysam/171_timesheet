<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#111111" />

  <title>171 Café Staff Timesheet</title>

  <link rel="manifest" href="manifest.json" />

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="favicon.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="icon-192.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="icon-512.png"
  />

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="apple-touch-icon.png"
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app-shell">

    <header class="brand-header">

      <img
        src="171_Logo_Timesheets.png"
        alt="171 On Pitt Staff Timesheet"
        class="brand-logo"
      />

      <div class="brand-copy">
        <p class="brand-title">Staff Timesheet</p>
      </div>

    </header>

    <section class="week-card">

      <div class="week-fields">

        <label>
          Week starting

          <input
            id="weekStart"
            type="date"
          />
        </label>

        <label>
          Week ending

          <input
            id="weekEnd"
            type="date"
            readonly
          />
        </label>

      </div>

      <div class="week-nav no-print">

        <button
          type="button"
          id="previousWeekBtn"
        >
          ← Previous Week
        </button>

        <button
          type="button"
          id="nextWeekBtn"
        >
          Next Week →
        </button>

      </div>

    </section>

    <section class="toolbar no-print">

      <button
        id="saveBtn"
        class="save-btn is-saved"
        type="button"
      >
        ✓ Saved
      </button>

      <button
        id="printBtn"
        type="button"
      >
        Print/PDF
      </button>

      <button
        id="resetBtn"
        class="clear-btn"
        type="button"
      >
        Clear
      </button>

    </section>

    <div
      id="statusIndicator"
      class="status-indicator status-saved no-print"
      aria-live="polite"
    >
      <span class="status-dot"></span>
      <span id="status"></span>
    </div>

    <section
      id="timesheet"
      class="timesheet"
    ></section>

    <section class="summary-card">

      <div id="employeeTotals"></div>

      <div class="grand">
        <span>Week total</span>
        <strong id="weekTotal">0.00</strong>
      </div>

    </section>

    <section class="manager-card">

      <label>
        Manager notes

        <textarea
          id="managerNotes"
          rows="3"
        ></textarea>
      </label>

      <div class="manager-grid">

        <label>
          Manager

          <input
            id="managerName"
            type="text"
          />
        </label>

        <label>
          Date

          <input
            id="managerDate"
            type="date"
          />
        </label>

      </div>

    </section>

  </main>

  <template id="dayTemplate">

    <article class="day-block">

      <h2></h2>

      <div class="column-headings">
        <span>Name</span>
        <span>Start</span>
        <span>Finish</span>
        <span>Total</span>
      </div>

      <div class="employeeRows"></div>

    </article>

  </template>

  <template id="employeeRowTemplate">

    <div class="shift-row">

      <strong class="employee-name"></strong>

      <select
        class="start"
        aria-label="Start time"
      ></select>

      <select
        class="finish"
        aria-label="Finish time"
      ></select>

      <output class="row-total">
        0.00
      </output>

    </div>

  </template>

  <template id="employeeTotalTemplate">

    <div class="employee-total-row">
      <span class="employee-total-name"></span>
      <strong class="employee-total-value">0.00</strong>
    </div>

  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>
</body>
</html>
